<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Jod Form</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: 'Poppins', sans-serif, system-ui;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%; 
            max-width: 400px; 
            box-sizing: border-box;
            margin: 20px auto;
        }
        .logo img {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        .heading h3 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        label {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        input {
            margin-bottom: 15px;
            padding: 12px; 
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13px; 
            width: 100%;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }
        input:focus {
            outline: none;
            border: 2px solid #305932;
        }
        button {
            padding: 14px;
            background-color: #305932;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #4e8251;
            cursor: not-allowed;
        }
        #complete-number, #number-exists, #useralready {
            display: none;
            color: #d93025;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        /* Success Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 2px solid #305932;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card h1 {
            font-size: 2.2rem;
            color: #305932;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .modal-card p {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .modal-card button {
            width: 100%;
            padding: 14px;
            background-color: #305932;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: opacity 0.3s;
        }
        .modal-card button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <img src="https://res.cloudinary.com/dsnlm6bod/image/upload/v1772262561/logo_mjnc2t.png" alt="Logo">
        </div>
        <div class="heading">
            <h3>Student Form</h3>
            <p id="useralready">User Already Exists</p>
        </div>
        <form id="studentForm">
            <label for="name">Name</label>
            <input name="name" type="text" id="name" placeholder="ENTER NAME" required 
                   onkeydown="if(/[0-9]/.test(event.key))event.preventDefault();" 
                   oninput="this.value = this.value.toUpperCase()">
            
            <label for="phonenumber">Phone Number</label>
            <input name="phonenumber" type="tel" id="phonenumber" placeholder="ENTER PHONE NUMBER" maxlength="10" required 
                   oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            <p id="complete-number">Please Enter 10 Digits Only</p>
            <p id="number-exists">This Number is Already Registered</p>

            <label for="qualification">Qualification</label>
            <input name="qualification" type="text" id="qualification" placeholder="ENTER QUALIFICATION" required 
                   oninput="this.value = this.value.toUpperCase()">
            
            <button type="submit" id="submit-btn" disabled>Submit</button>
        </form>
    </div>

    <!-- Success Modal Popup (No redirection, fast submission!) -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <h1>جزاك الله خيرا</h1>
            <p>Form Submitted Successfully!</p>
            <button id="closeModalBtn">Add Another Student</button>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phonenumber');
        const qualificationInput = document.getElementById('qualification');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('complete-number');
        const form = document.getElementById('studentForm');
        const alreadyExistMsg = document.getElementById('useralready');
        const numberExistsMsg = document.getElementById('number-exists');
        const successModal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        let isDuplicate = false;
        let lastCheckedPhone = "";

        const checkDuplicatePhone = async () => {
            const phone = phoneInput.value;
            if (phone.length === 10) {
                if (phone === lastCheckedPhone) {
                    validateForm();
                    return;
                }
                try {
                    const response = await fetch(`/check-phone?phone=${phone}`);
                    const result = await response.json();
                    lastCheckedPhone = phone;
                    if (result.exists) {
                        numberExistsMsg.style.display = 'block';
                        isDuplicate = true;
                    } else {
                        numberExistsMsg.style.display = 'none';
                        isDuplicate = false;
                    }
                } catch (err) {
                    console.error("Error checking duplicate phone:", err);
                }
            } else {
                numberExistsMsg.style.display = 'none';
                isDuplicate = false;
                lastCheckedPhone = "";
            }
            validateForm();
        };

        const validateForm = () => {
            const nameVal = nameInput.value.trim();
            const phoneVal = phoneInput.value;
            const qualVal = qualificationInput.value.trim();

            if (!nameVal || !phoneVal || !qualVal) {
                submitBtn.disabled = true;
                return;
            }

            if (phoneVal.length !== 10) {
                submitBtn.disabled = true;
                return;
            }

            if (isDuplicate) {
                submitBtn.disabled = true;
                return;
            }

            submitBtn.disabled = false;
        };

        nameInput.addEventListener('input', validateForm);
        qualificationInput.addEventListener('input', validateForm);

        phoneInput.addEventListener('input', async () => {
            const length = phoneInput.value.length;
            
            numberExistsMsg.style.display = 'none';
            isDuplicate = false;
            lastCheckedPhone = "";

            if (length === 0) {
                errorMsg.style.display = 'none';
            } else if (length === 10) {
                errorMsg.style.display = 'none';
                await checkDuplicatePhone();
            } else {
                errorMsg.style.display = 'block';
            }
            validateForm();
        });

        // Trigger immediate check on blur or change
        phoneInput.addEventListener('blur', checkDuplicatePhone);
        phoneInput.addEventListener('change', checkDuplicatePhone);

        // Close modal and reset form
        closeModalBtn.addEventListener('click', () => {
            successModal.classList.remove('show');
            form.reset();
            lastCheckedPhone = "";
            isDuplicate = false;
            validateForm();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isDuplicate) {
                numberExistsMsg.style.display = 'block';
                submitBtn.disabled = true;
                return;
            }

            const formData = new FormData(form);
            const jsonData = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                const result = await response.json();

                if (response.ok) {
                    // Show success popup instantly instead of redirecting!
                    successModal.classList.add('show');
                } else {
                    alreadyExistMsg.style.display = 'block';
                    setTimeout(() => {
                        alreadyExistMsg.style.display = 'none';
                        form.reset();
                        validateForm();
                    }, 2000);
                }
            } catch (err) {
                console.error("Error:", err);
            }
        });
    </script>
</body>
</html>
